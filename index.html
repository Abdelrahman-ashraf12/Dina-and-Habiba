<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Lomy!</title>
    
    <!-- الخطوط الجديدة -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #05080f; --card-bg: rgba(255, 255, 255, 0.04); --card-border: rgba(255, 255, 255, 0.08);
            --accent-pink: #ff477e; --accent-purple: #8338ec; --text-main: #f8fafc; --text-muted: #cbd5e1;
            --font-title: 'Cormorant Garamond', serif; --font-text: 'Outfit', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark); font-family: var(--font-text);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            overflow-x: hidden; overflow-y: auto; color: var(--text-main); position: relative; perspective: 1000px;
        }

        .ambient-orb {
            position: absolute; border-radius: 50%; filter: blur(150px); z-index: 1; opacity: 0.35;
            pointer-events: none; animation: floatOrb 15s infinite alternate ease-in-out;
        }
        .orb-1 { width: 450px; height: 450px; background: var(--accent-pink); top: -10%; left: -10%; }
        .orb-2 { width: 550px; height: 550px; background: var(--accent-purple); bottom: -15%; right: -10%; animation-delay: -5s; }
        @keyframes floatOrb { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(50px, 80px) scale(1.15); } }

        .particles-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        .particle { position: absolute; background: white; border-radius: 50%; opacity: 0.3; animation: floatUp linear infinite; }
        @keyframes floatUp { 0% { transform: translateY(100vh) scale(0); opacity: 0; } 50% { opacity: 0.6; } 100% { transform: translateY(-10vh) scale(1.5); opacity: 0; } }
        
        .wrapper { position: relative; z-index: 10; width: 100%; max-width: 750px; padding: 24px; display: flex; justify-content: center; align-items: center; transform-style: preserve-3d; }
        .glass-card {
            background: var(--card-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--card-border); border-radius: 24px; padding: 60px 40px;
            width: 100%; box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255,255,255,0.02);
            text-align: center; transition: transform 0.1s ease-out; transform-style: preserve-3d;
        }

        .gate-screen { display: flex; flex-direction: column; align-items: center; gap: 30px; transform: translateZ(30px); }
        .gate-title { font-family: var(--font-title); font-size: 3rem; font-weight: 700; background: linear-gradient(to right, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .cta-btn {
            background: linear-gradient(135deg, var(--accent-pink) 0%, var(--accent-purple) 100%);
            color: white; border: none; padding: 18px 45px; font-size: 1.1rem; font-weight: 500;
            border-radius: 50px; cursor: pointer; box-shadow: 0 0 30px rgba(255, 71, 126, 0.3);
            transition: all 0.3s ease; font-family: var(--font-text); letter-spacing: 1px;
        }
        .cta-btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 0 45px rgba(255, 71, 126, 0.6); }

        .main-screen { display: none; opacity: 0; transform: translateY(20px) translateZ(40px); transition: opacity 0.8s ease, transform 0.8s ease; }
        .main-screen.active { display: block; opacity: 1; transform: translateY(0) translateZ(40px); }

        .main-title {
            font-family: var(--font-title); font-size: 4rem; font-weight: 700; margin-bottom: 25px;
            background: linear-gradient(45deg, #ff477e, #8338ec, #06d6a0, #ffb703, #ff477e);
            background-size: 300% 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: gradientColorShift 6s ease infinite, floatTitle 4s ease-in-out infinite;
        }
        @keyframes gradientColorShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes floatTitle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        .birthday-text-container { min-height: 100px; margin-bottom: 35px; }
        .birthday-text { font-size: 1.3rem; color: var(--text-muted); line-height: 1.8; font-weight: 300; display: inline; }
        .cursor { display: inline-block; width: 3px; height: 1.2em; background-color: var(--accent-pink); vertical-align: middle; animation: blink 0.8s infinite; margin-left: 5px; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .actions-container { display: flex; justify-content: center; align-items: center; gap: 20px; flex-wrap: wrap; margin-top: 20px; }

        
            .video-btn {
                background: rgba(255, 255, 255, 0.05); 
                border: 1px solid var(--accent-purple); 
                color: white;
                padding: 12px 24px; 
                border-radius: 30px; 
                font-size: 1rem; 
                font-weight: 400; 
                cursor: pointer;
                transition: all 0.3s ease; 
                display: flex; 
                align-items: center; 
                gap: 8px; 
                font-family: var(--font-text);
                text-decoration: none;
                user-select: none; /* السطر الجديد اللي هيحل المشكلة */
}
        .video-btn:hover { background: rgba(131, 56, 236, 0.2); box-shadow: 0 0 20px rgba(131, 56, 236, 0.4); transform: translateY(-2px); color: white; }

        .audio-player {
            display: flex; align-items: center; gap: 12px; background: rgba(255, 255, 255, 0.02);
            padding: 10px 20px; border-radius: 30px; border: 1px solid var(--card-border); font-size: 0.85rem; color: #94a3b8;
        }
        .pulse-icon { width: 8px; height: 8px; background-color: #22c55e; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); } 70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }

        @media (max-width: 600px) { .glass-card { padding: 40px 20px; } .main-title { font-size: 2.8rem; } .birthday-text { font-size: 1.1rem; } .actions-container { flex-direction: column; } }
    </style>
</head>
<body>

    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="particles-container" id="particles"></div>

    <!-- الأغنية مضافة هنا -->
    <audio id="birthdaySong" loop preload="auto">
        <source src="WhatsApp Audio 2026-09-09 at 1.29.57 AM.mpeg" type="audio/mpeg">
    </audio>

    <div class="wrapper">
        <div class="glass-card" id="tiltCard">
            
            <div id="gateScreen" class="gate-screen">
                <h1 class="gate-title">A Special Message Awaits</h1>
                <button class="cta-btn" id="unlockBtn">Unlock the Magic ✨</button>
            </div>

            <div id="mainScreen" class="main-screen">
                <h1 class="main-title">Happy Birthday Dina and Habiba 🎉</h1>
                
                <div class="birthday-text-container">
                    <span class="birthday-text" id="typewriterText"></span><span class="cursor" id="cursor"></span>
                </div>

                <div class="actions-container">
                    <!-- الزرار بينقل لصفحة memories.html -->
                    <a href="memories.html" class="video-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        Watch Our Memories
                    </a>
                    <div class="audio-player"><div class="pulse-icon"></div><span>Playing soundtrack</span></div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 35; i++) {
            let p = document.createElement('div'); p.className = 'particle';
            let s = Math.random() * 4 + 2; p.style.width = s + 'px'; p.style.height = s + 'px';
            p.style.left = Math.random() * 100 + 'vw'; p.style.animationDuration = (Math.random() * 5 + 5) + 's'; p.style.animationDelay = Math.random() * 5 + 's';
            particlesContainer.appendChild(p);
        }

        const card = document.getElementById('tiltCard');
        document.addEventListener('mousemove', (e) => {
            if (window.innerWidth < 768) return;
            let xAxis = (window.innerWidth / 2 - e.pageX) / 40; let yAxis = (window.innerHeight / 2 - e.pageY) / 40;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });
        document.addEventListener('mouseleave', () => { card.style.transform = `rotateY(0deg) rotateX(0deg)`; });

        const unlockBtn = document.getElementById('unlockBtn'); const gateScreen = document.getElementById('gateScreen');
        const mainScreen = document.getElementById('mainScreen'); const song = document.getElementById('birthdaySong');
        
        const textToType = " Kol sana wento taybeen w b5eir w sa3ada ya rab, w Rabena y5aleekom le ba3d w y5aleekom leena w 3o2bal sneen kteer wento ma3ana w mnawreen 7yatna b wogodkom feha ♥️♥️♥️  Ya rab el sana el gaya tekoono 3aysheen wast a7lamakoo w mo7a2e2een kol elly nefskom feeh w ensha2allah el sana de tekoon agmal w a5af 3ala 2olobkom men kol elly fat w ydeem wogodkom ma3ana el 3omr kolo ya rab w dayman nshoofkom mabsooteen w far7aneen w mo7a2e2een kol elly betetmanooh ♥️♥️♥️♥️🫂🫂 ";
        const textElement = document.getElementById('typewriterText'); const cursor = document.getElementById('cursor'); let typeIndex = 0;

        function typeWriter() {
            if (typeIndex < textToType.length) {
                textElement.innerHTML += textToType.charAt(typeIndex); typeIndex++; setTimeout(typeWriter, 40);
            } else { cursor.style.animation = 'none'; cursor.style.opacity = '0'; }
        }

        unlockBtn.addEventListener('click', () => {
            song.play().catch(e => console.log("Audio block: ", e));
            gateScreen.style.opacity = '0'; gateScreen.style.transform = 'translateY(-10px) translateZ(30px)';
            setTimeout(() => {
                gateScreen.style.display = 'none'; mainScreen.style.display = 'block'; mainScreen.offsetHeight; 
                mainScreen.classList.add('active'); setTimeout(typeWriter, 500);
                const duration = 4*1000; const end = Date.now() + duration;
                (function frame() {
                    confetti({ particleCount: 4, angle: 60, spread: 55, origin: { x: 0, y: 0.8 }, colors: ['#ff477e', '#8338ec'] });
                    confetti({ particleCount: 4, angle: 120, spread: 55, origin: { x: 1, y: 0.8 }, colors: ['#ffb703', '#06d6a0'] });
                    if (Date.now() < end) requestAnimationFrame(frame);
                }());
            }, 400);
        });
    </script>
</body>
</html>
